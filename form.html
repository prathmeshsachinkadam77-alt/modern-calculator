<html>
    <head>
        <title>form design</title>
    </head>
    <body>
        <h1>student information</h1>
        <form>
            <label>Name:</label>
            <input type="text" name="name">
            <br><br> 
            <label>Password:</label>
            <input type="text" name="Password">
            <br><br>
            <label>Email:</label>
            <input type="text" name="Email">
            <br><br>
            <label>gender:</label>
            <input type="radio" value="male" name="male">reading
             <input type="radio" value="female" name="female">sports
             <br><br>
             <label>Hobbies:</label>
             <input type="checkbox" value="reading" name="reading">reading
             <input type="checkbox" value="sports" name="sports">sports
             <input type="checkbox" value="music" name="music">music
             <br><br>
             <label>course</label>
             <select name="Course">
                <option>BCA</option>
              <option>MCA</option>
              <option>BSc</option>
              <option>MSc</option>
            </select>
          <br><br>
          <label>address:</label>
          <br>
          <textarea name="address" rows="4" cols="30"></textarea>
            <br><br>
            <input type="submit" value="register"><br><br>
            <input type="reset" value="clear"><br><br>
        </form>
    </body>
</html>
