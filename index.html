<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AeroCalc - Modern Calculator</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .font-mono-numbers {
      font-family: 'JetBrains Mono', monospace;
    }
    /* Custom Glassmorphism styles */
    .glass-card {
      background: rgba(18, 24, 38, 0.72);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 1px 1px 0 rgba(255, 255, 255, 0.1);
    }
    .btn-glass {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(8px);
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-glass:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.18);
      transform: translateY(-1px);
    }
    .btn-glass:active {
      transform: scale(0.96) translateY(0);
      background: rgba(255, 255, 255, 0.2);
    }
    .btn-operator {
      background: rgba(99, 102, 241, 0.18);
      border: 1px solid rgba(129, 140, 248, 0.25);
      color: #a5b4fc;
    }
    .btn-operator:hover {
      background: rgba(99, 102, 241, 0.32);
      border-color: rgba(129, 140, 248, 0.45);
      color: #e0e7ff;
    }
    .btn-accent {
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 8px 20px -4px rgba(99, 102, 241, 0.5);
    }
    .btn-accent:hover {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      box-shadow: 0 10px 24px -2px rgba(99, 102, 241, 0.65);
      transform: translateY(-1px);
    }
    .btn-accent:active {
      transform: scale(0.96);
    }
    /* Scrollbar */
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 9999px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center p-3 sm:p-6 relative overflow-x-hidden">

  <!-- Ambient Glow Background Blobs -->
  <div class="fixed top-[-10%] left-[-10%] w-[45vw] h-[45vw] max-w-[500px] max-h-[500px] rounded-full bg-indigo-600/20 blur-[120px] pointer-events-none"></div>
  <div class="fixed bottom-[-10%] right-[-10%] w-[45vw] h-[45vw] max-w-[500px] max-h-[500px] rounded-full bg-purple-600/20 blur-[120px] pointer-events-none"></div>
  <div class="fixed top-[40%] right-[30%] w-[30vw] h-[30vw] max-w-[350px] max-h-[350px] rounded-full bg-cyan-600/10 blur-[100px] pointer-events-none"></div>

  <!-- Calculator Container -->
  <main class="w-full max-w-[390px] glass-card rounded-3xl p-5 sm:p-6 relative z-10 overflow-hidden flex flex-col gap-4 shadow-2xl">
    
    <!-- Top Action Bar -->
    <header class="flex items-center justify-between text-slate-400">
      <div class="flex items-center gap-2">
        <div class="w-3 h-3 rounded-full bg-rose-500/80"></div>
        <div class="w-3 h-3 rounded-full bg-amber-500/80"></div>
        <div class="w-3 h-3 rounded-full bg-emerald-500/80"></div>
        <span class="text-xs font-medium tracking-wider text-slate-400 ml-1.5 uppercase">AeroCalc</span>
      </div>
      
      <div class="flex items-center gap-1.5">
        <button id="btn-copy" title="Copy result" class="p-2 rounded-xl text-slate-400 hover:text-white hover:bg-white/5 transition-colors active:scale-95">
          <i data-lucide="copy" class="w-4 h-4"></i>
        </button>
        <button id="btn-history-toggle" title="Toggle History" class="relative p-2 rounded-xl text-slate-400 hover:text-white hover:bg-white/5 transition-colors active:scale-95">
          <i data-lucide="history" class="w-4 h-4"></i>
          <span id="history-badge" class="hidden absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-indigo-500"></span>
        </button>
      </div>
    </header>

    <!-- Calculation Display Screen -->
    <section class="flex flex-col justify-end items-end p-4 rounded-2xl bg-slate-900/40 border border-white/5 min-h-[110px] sm:min-h-[120px] overflow-hidden">
      <!-- Secondary Expression Display -->
      <div id="sub-display" class="font-mono-numbers text-sm sm:text-base text-slate-400 tracking-wide font-normal h-6 overflow-hidden text-ellipsis whitespace-nowrap w-full text-right">
      </div>
      
      <!-- Primary Active Value Display -->
      <div id="main-display" class="font-mono-numbers text-3xl sm:text-4xl font-semibold tracking-tight text-white mt-1 w-full text-right overflow-x-auto overflow-y-hidden custom-scrollbar">
        0
      </div>
    </section>

    <!-- Keypad Grid -->
    <section class="grid grid-cols-4 gap-2.5 sm:gap-3 text-base sm:text-lg font-medium">
      <!-- Row 1 -->
      <button data-action="clear" class="btn-glass p-3.5 sm:p-4 rounded-2xl text-rose-400 font-semibold active:scale-95">AC</button>
      <button data-action="backspace" class="btn-glass p-3.5 sm:p-4 rounded-2xl text-slate-300 flex items-center justify-center active:scale-95">
        <i data-lucide="delete" class="w-5 h-5"></i>
      </button>
      <button data-action="percent" class="btn-glass p-3.5 sm:p-4 rounded-2xl text-slate-300 active:scale-95">%</button>
      <button data-action="operator" data-val="/" class="btn-glass btn-operator p-3.5 sm:p-4 rounded-2xl text-xl active:scale-95">÷</button>

      <!-- Row 2 -->
      <button data-action="num" data-val="7" class="btn-glass p-3.5 sm:p-4 rounded-2xl text-white active:scale-95">7</button>
      <button data-action="num" data-val="8" class="btn-glass p-3.5 sm:p-4 rounded-2xl text-white active:scale-95">8</button>
      <button data-action="num" data-val="9" class="btn-glass p-3.5 sm:p-4 rounded-2xl text-white active:scale-95">9</button>
      <button data-action="operator" data-val="*" class="btn-glass btn-operator p-3.5 sm:p-4 rounded-2xl text-xl active:scale-95">×</button>

      <!-- Row 3 -->
      <button data-action="num" data-val="4" class="btn-glass p-3.5 sm:p-4 rounded-2xl text-white active:scale-95">4</button>
      <button data-action="num" data-val="5" class="btn-glass p-3.5 sm:p-4 rounded-2xl text-white active:scale-95">5</button>
      <button data-action="num" data-val="6" class="btn-glass p-3.5 sm:p-4 rounded-2xl text-white active:scale-95">6</button>
      <button data-action="operator" data-val="-" class="btn-glass btn-operator p-3.5 sm:p-4 rounded-2xl text-2xl active:scale-95">−</button>

      <!-- Row 4 -->
      <button data-action="num" data-val="1" class="btn-glass p-3.5 sm:p-4 rounded-2xl text-white active:scale-95">1</button>
      <button data-action="num" data-val="2" class="btn-glass p-3.5 sm:p-4 rounded-2xl text-white active:scale-95">2</button>
      <button data-action="num" data-val="3" class="btn-glass p-3.5 sm:p-4 rounded-2xl text-white active:scale-95">3</button>
      <button data-action="operator" data-val="+" class="btn-glass btn-operator p-3.5 sm:p-4 rounded-2xl text-xl active:scale-95">+</button>

      <!-- Row 5 -->
      <button data-action="negate" class="btn-glass p-3.5 sm:p-4 rounded-2xl text-slate-300 font-mono text-sm sm:text-base active:scale-95">±</button>
      <button data-action="num" data-val="0" class="btn-glass p-3.5 sm:p-4 rounded-2xl text-white active:scale-95">0</button>
      <button data-action="decimal" class="btn-glass p-3.5 sm:p-4 rounded-2xl text-white active:scale-95 font-mono">.</button>
      <button data-action="equals" class="btn-accent p-3.5 sm:p-4 rounded-2xl text-white font-bold text-xl active:scale-95">=</button>
    </section>

    <!-- Slide-over History Drawer -->
    <div id="history-drawer" class="absolute inset-0 bg-slate-900/95 backdrop-blur-xl z-20 flex flex-col p-5 transform translate-y-full transition-transform duration-300 ease-in-out">
      <div class="flex items-center justify-between pb-3 border-b border-white/10">
        <div class="flex items-center gap-2 text-indigo-400 font-medium">
          <i data-lucide="clock" class="w-4 h-4"></i>
          <span>Calculation History</span>
        </div>
        <div class="flex items-center gap-1">
          <button id="btn-clear-history" title="Clear history" class="p-1.5 rounded-lg text-slate-400 hover:text-rose-400 transition-colors">
            <i data-lucide="trash-2" class="w-4 h-4"></i>
          </button>
          <button id="btn-close-history" title="Close" class="p-1.5 rounded-lg text-slate-400 hover:text-white transition-colors">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <!-- History List -->
      <div id="history-list" class="flex-1 overflow-y-auto custom-scrollbar my-3 flex flex-col gap-2.5 pr-1">
        <!-- Rendered items go here -->
      </div>

      <div class="text-[11px] text-center text-slate-400 tracking-wide pt-2 border-t border-white/5">
        Click any previous item to reuse its result
      </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="absolute bottom-4 left-1/2 -translate-x-1/2 bg-slate-800/90 border border-slate-700 text-slate-200 text-xs px-3.5 py-1.5 rounded-full shadow-lg opacity-0 pointer-events-none transition-opacity duration-200 z-30">
      Copied to clipboard
    </div>
  </main>

  <!-- Script logic -->
  <script>
    // Initialize Lucide Icons
    lucide.createIcons();

    // Calculator State Machine
    const state = {
      currentValue: '0',
      previousValue: null,
      operator: null,
      shouldResetCurrent: false,
      history: []
    };

    // DOM Elements
    const mainDisplay = document.getElementById('main-display');
    const subDisplay = document.getElementById('sub-display');
    const historyDrawer = document.getElementById('history-drawer');
    const historyList = document.getElementById('history-list');
    const historyBadge = document.getElementById('history-badge');
    const toast = document.getElementById('toast');

    // Display Format Helper
    function formatNumber(numStr) {
      if (!numStr || numStr === 'Error') return numStr;
      if (numStr.endsWith('.')) return numStr;
      
      const parts = numStr.split('.');
      const integerPart = parts[0];
      const decimalPart = parts[1];

      // Add commas to integer part
      const formattedInteger = Number(integerPart).toLocaleString('en-US');
      return decimalPart !== undefined ? `${formattedInteger}.${decimalPart}` : formattedInteger;
    }

    // Update Main & Sub Displays
    function updateDisplay() {
      mainDisplay.textContent = formatNumber(state.currentValue);
      
      // Auto adjust font size on long values
      const len = state.currentValue.length;
      if (len > 12) {
        mainDisplay.className = mainDisplay.className.replace(/text-(3xl|4xl|2xl)/g, 'text-xl');
      } else if (len > 8) {
        mainDisplay.className = mainDisplay.className.replace(/text-(4xl|xl)/g, 'text-2xl');
      } else {
        mainDisplay.className = mainDisplay.className.replace(/text-(2xl|xl)/g, 'text-3xl sm:text-4xl');
      }

      // Update secondary helper display
      if (state.operator && state.previousValue !== null) {
        const opSymbol = getOperatorSymbol(state.operator);
        subDisplay.textContent = `${formatNumber(state.previousValue)} ${opSymbol}`;
      } else {
        subDisplay.textContent = '';
      }
    }

    function getOperatorSymbol(op) {
      switch (op) {
        case '+': return '+';
        case '-': return '−';
        case '*': return '×';
        case '/': return '÷';
        default: return op;
      }
    }

    // Toast feedback
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.remove('opacity-0');
      setTimeout(() => {
        toast.classList.add('opacity-0');
      }, 1800);
    }

    // Core Math Actions
    function appendDigit(digit) {
      if (state.currentValue === 'Error' || state.shouldResetCurrent) {
        state.currentValue = digit;
        state.shouldResetCurrent = false;
      } else {
        if (state.currentValue === '0') {
          state.currentValue = digit;
        } else if (state.currentValue.replace(/[^0-9]/g, '').length < 15) {
          state.currentValue += digit;
        }
      }
      updateDisplay();
    }

    function appendDecimal() {
      if (state.shouldResetCurrent || state.currentValue === 'Error') {
        state.currentValue = '0.';
        state.shouldResetCurrent = false;
      } else if (!state.currentValue.includes('.')) {
        state.currentValue += '.';
      }
      updateDisplay();
    }

    function handleOperator(op) {
      if (state.currentValue === 'Error') return;

      if (state.operator && !state.shouldResetCurrent) {
        calculate(false);
      }
      
      state.previousValue = state.currentValue;
      state.operator = op;
      state.shouldResetCurrent = true;
      updateDisplay();
    }

    function calculate(isFinal = true) {
      if (!state.operator || state.previousValue === null || state.currentValue === 'Error') return;

      const prev = parseFloat(state.previousValue);
      const curr = parseFloat(state.currentValue);
      let result = 0;

      if (state.operator === '/' && curr === 0) {
        state.currentValue = 'Error';
        state.previousValue = null;
        state.operator = null;
        subDisplay.textContent = 'Division by zero';
        updateDisplay();
        return;
      }

      switch (state.operator) {
        case '+': result = prev + curr; break;
        case '-': result = prev - curr; break;
        case '*': result = prev * curr; break;
        case '/': result = prev / curr; break;
      }

      // Clean floating-point precision inaccuracies
      result = parseFloat(result.toPrecision(12));
      const resultStr = String(result);

      // Record History
      if (isFinal) {
        addHistoryItem({
          expression: `${formatNumber(state.previousValue)} ${getOperatorSymbol(state.operator)} ${formatNumber(state.currentValue)}`,
          result: resultStr
        });
        subDisplay.textContent = `${formatNumber(state.previousValue)} ${getOperatorSymbol(state.operator)} ${formatNumber(state.currentValue)} =`;
        state.previousValue = null;
        state.operator = null;
      }

      state.currentValue = resultStr;
      state.shouldResetCurrent = true;
      updateDisplay();
    }

    function clearAll() {
      state.currentValue = '0';
      state.previousValue = null;
      state.operator = null;
      state.shouldResetCurrent = false;
      updateDisplay();
    }

    function deleteLast() {
      if (state.currentValue === 'Error' || state.shouldResetCurrent) {
        state.currentValue = '0';
      } else {
        state.currentValue = state.currentValue.slice(0, -1);
        if (state.currentValue === '' || state.currentValue === '-') {
          state.currentValue = '0';
        }
      }
      updateDisplay();
    }

    function toggleSign() {
      if (state.currentValue === '0' || state.currentValue === 'Error') return;
      state.currentValue = state.currentValue.startsWith('-')
        ? state.currentValue.slice(1)
        : '-' + state.currentValue;
      updateDisplay();
    }

    function computePercent() {
      if (state.currentValue === 'Error') return;
      const num = parseFloat(state.currentValue);
      state.currentValue = String(parseFloat((num / 100).toPrecision(12)));
      updateDisplay();
    }

    // History Logic
    function addHistoryItem(item) {
      state.history.unshift(item);
      if (state.history.length > 20) state.history.pop();
      renderHistory();
      historyBadge.classList.remove('hidden');
    }

    function renderHistory() {
      historyList.innerHTML = '';
      if (state.history.length === 0) {
        historyList.innerHTML = `
          <div class="h-full flex flex-col items-center justify-center text-slate-500 py-12">
            <i data-lucide="inbox" class="w-8 h-8 mb-2 stroke-1 opacity-50"></i>
            <p class="text-xs">No recent calculations</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      state.history.forEach((h, index) => {
        const itemEl = document.createElement('div');
        itemEl.className = 'p-3 bg-white/5 hover:bg-white/10 rounded-xl cursor-pointer border border-white/5 transition-all flex flex-col items-end gap-1 group';
        itemEl.innerHTML = `
          <div class="text-xs text-slate-400 font-mono-numbers group-hover:text-indigo-300 transition-colors">${h.expression}</div>
          <div class="text-base text-white font-semibold font-mono-numbers tracking-tight">= ${formatNumber(h.result)}</div>
        `;
        itemEl.onclick = () => {
          state.currentValue = h.result;
          state.shouldResetCurrent = true;
          updateDisplay();
          closeDrawer();
        };
        historyList.appendChild(itemEl);
      });
      lucide.createIcons();
    }

    function openDrawer() {
      historyDrawer.classList.remove('translate-y-full');
      historyBadge.classList.add('hidden');
    }

    function closeDrawer() {
      historyDrawer.classList.add('translate-y-full');
    }

    // Keypad Click Event Delegation
    document.querySelector('.grid').addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;

      const action = btn.dataset.action;
      const val = btn.dataset.val;

      switch (action) {
        case 'num': appendDigit(val); break;
        case 'decimal': appendDecimal(); break;
        case 'operator': handleOperator(val); break;
        case 'equals': calculate(true); break;
        case 'clear': clearAll(); break;
        case 'backspace': deleteLast(); break;
        case 'negate': toggleSign(); break;
        case 'percent': computePercent(); break;
      }
    });

    // Top Bar Actions
    document.getElementById('btn-history-toggle').addEventListener('click', openDrawer);
    document.getElementById('btn-close-history').addEventListener('click', closeDrawer);
    document.getElementById('btn-clear-history').addEventListener('click', () => {
      state.history = [];
      renderHistory();
    });

    document.getElementById('btn-copy').addEventListener('click', () => {
      const copyVal = state.currentValue;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(copyVal).then(() => showToast('Copied to clipboard'));
      } else {
        const temp = document.createElement('textarea');
        temp.value = copyVal;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand('copy');
        document.body.removeChild(temp);
        showToast('Copied to clipboard');
      }
    });

    // Keyboard Support
    window.addEventListener('keydown', (e) => {
      if (e.key >= '0' && e.key <= '9') {
        appendDigit(e.key);
      } else if (e.key === '.') {
        appendDecimal();
      } else if (e.key === '+' || e.key === '-' || e.key === '*' || e.key === '/') {
        handleOperator(e.key);
      } else if (e.key === 'Enter' || e.key === '=') {
        e.preventDefault();
        calculate(true);
      } else if (e.key === 'Backspace') {
        deleteLast();
      } else if (e.key === 'Escape') {
        clearAll();
      } else if (e.key === '%') {
        computePercent();
      }
    });

    // Initialize UI
    renderHistory();
    updateDisplay();
  </script>
</body>
</html>
